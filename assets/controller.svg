<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14151a"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f6"/>
      <stop offset="1" stop-color="#d9dae0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c33"/>
      <stop offset="1" stop-color="#17181d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e07a3f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e07a3f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <ellipse cx="700" cy="330" rx="420" ry="200" fill="url(#glow)"/>

  <!-- Controller (original drawing) -->
  <g transform="translate(100,60)" filter="url(#soft)">
    <!-- shoulders -->
    <rect x="285" y="168" width="130" height="22" rx="11" fill="#c9cad1"/>
    <rect x="785" y="168" width="130" height="22" rx="11" fill="#c9cad1"/>
    <!-- body -->
    <path d="M 420 200 C 480 172, 720 172, 780 200 L 860 210 C 930 215, 962 262, 976 322
             C 1002 422, 1012 522, 962 562 C 922 594, 880 562, 850 522 L 800 452
             C 760 432, 440 432, 400 452 L 350 522 C 320 562, 278 594, 238 562
             C 188 522, 198 422, 224 322 C 238 262, 270 215, 340 210 Z" fill="url(#shell)"/>
    <!-- dark core -->
    <path d="M 430 330 C 470 300, 730 300, 770 330 L 790 440 C 740 425, 460 425, 410 440 Z" fill="url(#core)"/>
    <!-- touchpad + light bar -->
    <rect x="478" y="192" width="244" height="124" rx="20" fill="#ececf0" stroke="#c4c5cc" stroke-width="2"/>
    <path d="M 470 206 C 466 240, 466 280, 474 312" stroke="#e07a3f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 730 206 C 734 240, 734 280, 726 312" stroke="#e07a3f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- create / options -->
    <rect x="440" y="206" width="12" height="26" rx="6" fill="#3a3c44"/>
    <rect x="748" y="206" width="12" height="26" rx="6" fill="#3a3c44"/>
    <!-- d-pad -->
    <g fill="#3a3c44">
      <rect x="316" y="252" width="28" height="36" rx="7"/>
      <rect x="316" y="312" width="28" height="36" rx="7"/>
      <rect x="276" y="286" width="36" height="28" rx="7"/>
      <rect x="348" y="286" width="36" height="28" rx="7"/>
    </g>
    <!-- face buttons -->
    <g stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="870" cy="258" r="21" fill="#2b2d34" stroke="none"/>
      <path d="M 870 248 L 880 266 L 860 266 Z" stroke="#e8e8ec"/>
      <circle cx="914" cy="300" r="21" fill="#2b2d34" stroke="none"/>
      <circle cx="914" cy="300" r="9" stroke="#e8e8ec"/>
      <circle cx="870" cy="342" r="21" fill="#2b2d34" stroke="none"/>
      <path d="M 862 334 L 878 350 M 878 334 L 862 350" stroke="#e8e8ec"/>
      <circle cx="826" cy="300" r="21" fill="#2b2d34" stroke="none"/>
      <rect x="818" y="292" width="16" height="16" rx="1.5" stroke="#e8e8ec"/>
    </g>
    <!-- sticks -->
    <circle cx="470" cy="388" r="40" fill="#1b1c21"/>
    <circle cx="470" cy="388" r="28" fill="#2f3138" stroke="#44464f" stroke-width="3"/>
    <circle cx="730" cy="388" r="40" fill="#1b1c21"/>
    <circle cx="730" cy="388" r="28" fill="#2f3138" stroke="#44464f" stroke-width="3"/>
    <!-- PS + mic -->
    <circle cx="600" cy="372" r="14" fill="#3a3c44"/>
    <rect x="586" y="404" width="28" height="6" rx="3" fill="#e07a3f"/>
  </g>

  <!-- Callouts -->
  <g stroke="#e07a3f" stroke-width="1.6" fill="none" opacity="0.9">
    <path d="M 280 112 L 440 112 L 450 228"/>
    <path d="M 1120 112 L 960 112 L 950 228"/>
    <path d="M 280 360 L 375 360"/>
    <path d="M 1120 360 L 1036 360"/>
    <path d="M 280 560 L 520 560 L 568 470"/>
    <path d="M 1120 560 L 880 560 L 832 470"/>
    <path d="M 700 92 L 700 252"/>
    <path d="M 552 650 L 552 300"/>
    <path d="M 848 650 L 848 300"/>
    <path d="M 700 650 L 700 446"/>
  </g>
  <g fill="#e07a3f">
    <circle cx="450" cy="228" r="4"/><circle cx="950" cy="228" r="4"/>
    <circle cx="375" cy="360" r="4"/><circle cx="1036" cy="360" r="4"/>
    <circle cx="568" cy="470" r="4"/><circle cx="832" cy="470" r="4"/>
    <circle cx="700" cy="252" r="4"/><circle cx="552" cy="300" r="4"/>
    <circle cx="848" cy="300" r="4"/><circle cx="700" cy="446" r="4"/>
  </g>

  <g fill="#f3f3f5">
    <text x="270" y="106" text-anchor="end" font-size="20" font-weight="700">L1</text>
    <text x="270" y="132" text-anchor="end" font-size="15" fill="#a9abb5">previous tab · hold for combos</text>

    <text x="1130" y="106" font-size="20" font-weight="700">R1</text>
    <text x="1130" y="132" font-size="15" fill="#a9abb5">next tab</text>

    <text x="270" y="354" text-anchor="end" font-size="20" font-weight="700">D-pad</text>
    <text x="270" y="380" text-anchor="end" font-size="15" fill="#a9abb5">arrow keys for Claude menus</text>

    <text x="1130" y="340" font-size="20" font-weight="700">✕ Enter   ○ Esc</text>
    <text x="1130" y="368" font-size="20" font-weight="700">□ Tab   △ Mode</text>
    <text x="1130" y="394" font-size="15" fill="#a9abb5">hold ○ to interrupt</text>

    <text x="270" y="554" text-anchor="end" font-size="20" font-weight="700">Left stick</text>
    <text x="270" y="580" text-anchor="end" font-size="15" fill="#a9abb5">smooth cursor · L3 click</text>

    <text x="1130" y="554" font-size="20" font-weight="700">Right stick</text>
    <text x="1130" y="580" font-size="15" fill="#a9abb5">scroll · R3 right click</text>

    <text x="700" y="56" text-anchor="middle" font-size="20" font-weight="700">Touchpad</text>
    <text x="700" y="80" text-anchor="middle" font-size="15" fill="#a9abb5">trackpad · tap to click · hold to talk</text>

    <text x="552" y="676" text-anchor="middle" font-size="18" font-weight="700">Create</text>
    <text x="552" y="698" text-anchor="middle" font-size="14" fill="#a9abb5">quick menu</text>
    <text x="700" y="676" text-anchor="middle" font-size="18" font-weight="700">PS</text>
    <text x="700" y="698" text-anchor="middle" font-size="14" fill="#a9abb5">switch app</text>
    <text x="848" y="676" text-anchor="middle" font-size="18" font-weight="700">Options</text>
    <text x="848" y="698" text-anchor="middle" font-size="14" fill="#a9abb5">next window</text>
  </g>
</svg>
